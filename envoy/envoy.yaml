node:
  id: envoy-proxy
  cluster: ail-internal

static_resources:

  listeners:
  - name: mtls_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8443
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_https
          route_config:
            name: local_route
            virtual_hosts:
            # Phase 2, D12: the agent no longer talks to OPA directly - it
            # talks to the decision service, which now owns schema
            # validation, the OPA query, and the ledger write. This is the
            # same Stage-1 mTLS terminator retargeted at the relocated
            # boundary, not a new identity mechanism.
            - name: decision_service_backend
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: decision_service_cluster
                  # Envoy's own default route timeout (15s) is shorter than
                  # the D14 mediated tool's own round trip: decision-service
                  # spawns a fresh Python interpreter for vault_server.py per
                  # call (no persistent MCP session), which alone can take
                  # 10+ seconds in a resource-constrained container - live-
                  # measured at ~15.7s, confirmed against Envoy's default by
                  # a 504 Gateway Timeout the agent's own read_vault_secret
                  # call otherwise hit here even though decision-service
                  # completed the call successfully just after the cutoff.
                  timeout: 45s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: true
          common_tls_context:
            # Pull our own certificate/key from SPIRE via SDS
            tls_certificate_sds_secret_configs:
            - name: "spiffe://ail.internal/workload/envoy"
              sds_config:
                resource_api_version: V3
                api_config_source:
                  api_type: GRPC
                  transport_api_version: V3
                  grpc_services:
                  - envoy_grpc:
                      cluster_name: spire_agent
            # Validate client certificates via SPIRE trust bundle
            combined_validation_context:
              default_validation_context:
                match_typed_subject_alt_names:
                - san_type: URI
                  matcher:
                    exact: "spiffe://ail.internal/workload/agent"
                # workload/test (unix:uid:0 / root) removed — root identity
                # must never be a valid mTLS client in production.
              validation_context_sds_secret_config:
                name: "spiffe://ail.internal"
                sds_config:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                    - envoy_grpc:
                        cluster_name: spire_agent

  clusters:
  # Decision service backend (Phase 2, D12 - retargeted from OPA).
  - name: decision_service_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: decision_service_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: decision-service
                port_value: 8010

  # SPIRE Workload API (SDS source)
  - name: spire_agent
    connect_timeout: 5s
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    load_assignment:
      cluster_name: spire_agent
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe:
                path: /tmp/spire-sockets/workload_api.sock

admin:
  address:
    socket_address:
      # Loopback-only: admin interface must not be reachable from other containers.
      address: 127.0.0.1
      port_value: 9901
