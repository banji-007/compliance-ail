services:
  ail-control-plane:
    build:
      # D22 (Phase 3b): built from the repo root so the image can carry
      # provenance/ - the canonicalization rule this service shares with
      # every other writer of a ledger record.
      context: .
      dockerfile: control_plane/Dockerfile
    # No host port published (R1, Phase 1.3 completion pass, red-team V2):
    # this is a record-writing surface (PUT /tenants, POST/DELETE /content) -
    # host.docker.internal reaches a loopback-bound port from any container
    # on the Docker host regardless of which network it is on, so binding
    # cannot close this the way it closes off-host LAN reach. The dashboard
    # reaches this service by its compose DNS name (CONTROL_PLANE_URL=http://
    # ail-control-plane:8002), which does not require a host-published port.
    # To reach this API from the host for debugging, use
    # `docker compose exec ail-control-plane` or a sibling container on the
    # compose network - see readME.md section 4.6.
    environment:
      - DATABASE_URL=sqlite:////data/control_plane.db
      # ImmuDB REST (used for scan in /audit; scan needs no SDK).
      - IMMUDB_URL=http://immudb:8080
      - IMMUDB_USER=${IMMUDB_USER}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD}
      # Verifier service — /audit calls this for per-entry proof verification.
      - VERIFIER_URL=http://verifier:8003
      # Two independent keys, not one shared key (D6). READ authorizes only
      # GET /audit; WRITE authorizes PUT/POST /tenants and POST/DELETE
      # /content. Must be set in .env — an absent key disables the routes it
      # gates with a 503 response.
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY}
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY}
      # D21 (Phase 3a completion): the verifier's own credential pair,
      # independent of CONTROL_PLANE_READ_KEY/WRITE_KEY above - a compromise
      # of one layer does not hand out the other's. The control plane holds
      # both: READ for every /verify call (get_audit, get_audit_bundle,
      # _has_tombstone), WRITE for the one /write call (_write_tombstone).
      # See docs/adr/0011-verifier-authentication.md.
      - VERIFIER_READ_KEY=${VERIFIER_READ_KEY}
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY}
      # D22 (Phase 3b): this service's OWN writer key, not the decision
      # service's. It signs exactly one kind of record, the erasure
      # tombstone, and a bundle's writer_key_fingerprint names which of the
      # two wrote the record it carries.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-control-plane.key
      # D36 (Phase 3c-3c): the seam between backfilled history and live
      # traffic. Bound into the ledger at first allocation; this service
      # refuses to serve a page if its own value disagrees with the bound
      # one, so all three declarations have to be the same string.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
    volumes:
      # policy/ mounted at runtime — changes on tenant config updates.
      - ./policy:/policy:ro
      - ./keys:/keys:ro
      - control-plane-data:/data
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # P2-1 (Phase 2): backend-only. Never reachable from the agent
    # (langgraph-demo, edge-only) - see the networks: block at the bottom
    # of this file and docs/adr/0008-decision-service-boundary.md.
    networks:
      - backend

  opa:
    image: openpolicyagent/opa:1.14.1
    # No host port published (R1, Phase 1.3 completion pass, red-team V2).
    # The previous fix was a loopback bind ("127.0.0.1:8181:8181", P13-1),
    # restricting reachability to the host itself and the compose network.
    # Red-team V2 showed the loopback bind does not hold: host.docker.internal
    # reaches a 127.0.0.1-published port from any container on the Docker
    # host, including one on a network unrelated to this compose project.
    # Binding cannot close that, so the fix is to not publish this port to
    # the host at all. Envoy (8443) remains the client-facing surface;
    # nothing needs OPA's own port from outside the compose network. The
    # test stack (docker-compose.test.yml) still publishes this port,
    # loopback-bound, deliberately - see that file's own header comment.
    environment:
      - AIL_TENANT_ID=${AIL_TENANT_ID:-tenant_default}
      # Single-sourced bundle key - opa-config.yaml's `bundles:` key and
      # interceptor/middleware.py's revision lookup both read this same
      # var. See opa-config.yaml and docs/reports/phase-0-1.md, P01-3.
      - AIL_BUNDLE_NAME=${AIL_BUNDLE_NAME:-ail-policies}
      # R4 (Phase 1.3 completion pass): opa-config.yaml attaches this as the
      # X-API-Key header on every bundle poll against GET /bundles/{tenant}
      # - that route now requires the read-scoped credential (red-team V6).
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY}
    command:
      - "run"
      - "--server"
      - "--config-file=/config/opa-config.yaml"
      - "--log-format=text"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
    volumes:
      - ./opa-config.yaml:/config/opa-config.yaml:ro
    depends_on:
      ail-control-plane:
        condition: service_healthy
    # OPA loads policy via bundle API — no local files to eval against.
    # Health check verifies the binary is alive; bundle load status is
    # visible in OPA logs and Prometheus metrics.
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # P2-1: backend-only, same reasoning as ail-control-plane above. This is
    # the surface U1/U8 (docs/reports/phase-1-2-redteam.md) used when the
    # agent shared this network - it no longer does.
    networks:
      - backend

  immudb:
    image: codenotary/immudb:1.9.5
    # No host port published (R1, Phase 1.3 completion pass): neither the
    # gRPC port (3322) nor the REST port (8080) is exposed to the host -
    # this is ImmuDB's own direct read/write surface, independent of the
    # verifier layer entirely. Access via service name 'immudb' from other
    # containers on the compose network. See docs/adr/0002-fastapi-immudb-
    # proxy.md, which this now matches. docker-compose.test.yml publishes
    # both, deliberately, for the integration suite - see that file.
    environment:
      - IMMUDB_USER=${IMMUDB_USER}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD}
    volumes:
      # Signing key enables cryptographic state signing. Generate once with
      # "make keygen" before starting. Without this file, ImmuDB starts without
      # signing; the verifier will log a warning but still run.
      - ./keys:/keys:ro
      # ImmuDB's own data dir. Without this, a `down` (no -v) + `up` cycle
      # recreates ImmuDB empty while verifier-state (below) persists its old
      # trust anchor, and the next verifiedGet fails with "illegal state"
      # (Phase 1, P1-10) - the two volumes must be symmetric.
      - immudb-data:/var/lib/immudb
    command:
      - "--signingKey=/keys/signing.key"
    healthcheck:
      test: ["CMD", "immuadmin", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  # AIL Verifier — isolated immudb-py (gRPC) wrapper.
  # Keeps the SDK's protobuf dependency out of the interceptor process so
  # SPIFFE mTLS is not compromised (see ADR-0001). The decision service and
  # the control plane call this service for all verified writes and reads
  # (Phase 2, D12 - the agent's own interceptor process used to call it
  # directly; it no longer holds VERIFIER_URL or any route to this network
  # segment at all).
  verifier:
    build:
      # D35 (Phase 3c-3c): built from the repo root so the image can
      # carry provenance/ - this service signs the fault record it writes.
      context: .
      dockerfile: verifier/Dockerfile
    # No host port published (R1, Phase 1.3 completion pass). The previous
    # fix was a loopback bind ("127.0.0.1:8003:8003", P13-2); red-team V2
    # showed host.docker.internal reaches a loopback-bound port from any
    # container on the Docker host, so binding alone does not close this.
    # /write and /verify carried no authentication of their own until D21
    # (Phase 3a completion) - the exact surface red-team U5 used to forge a
    # tombstone, and X5 used to bypass GET /audit/bundle's read-key gate by
    # going straight to the source the bundle route itself calls. Both
    # routes now require VERIFIER_READ_KEY/VERIFIER_WRITE_KEY - see
    # docs/adr/0011-verifier-authentication.md. P2-1 (Phase 2) separately
    # closes the residual this comment used to describe (the agent container
    # sharing this network): the agent is edge-only now and this service is
    # backend-only, so the agent has no route here at all, mutation-tested
    # in tests/test_decision_service_network_isolation.py. The test stack
    # still publishes this port, loopback-bound, deliberately - see
    # docker-compose.test.yml.
    environment:
      - IMMUDB_ADDR=immudb:3322
      - IMMUDB_USER=${IMMUDB_USER}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD}
      # Path to ImmuDB's public signing key (derived from keys/signing.key).
      # The verifier checks every server state response against this key.
      - IMMUDB_SIGNING_PUBKEY=/keys/signing.pub
      - VERIFIER_STATE_FILE=/data/verifier-state/immudb.state
      # D21: this service's own credential pair (docs/adr/0011-verifier-
      # authentication.md), distinct from CONTROL_PLANE_READ_KEY/WRITE_KEY.
      # An absent key disables the route it gates with a 503 response,
      # matching control_plane/main.py's fail-closed behavior exactly.
      - VERIFIER_READ_KEY=${VERIFIER_READ_KEY}
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY}
      # D22/D35 (Phase 3c-3c): this service's OWN writer key. It signs
      # exactly one kind of record, the ledger fault written when a
      # committed write's proof does not check out.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-verifier.key
      # D36: see ail-control-plane above.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
    volumes:
      - ./keys:/keys:ro
      # Verifier state is its own volume, not shared with the ledger-writing
      # identity (langgraph-demo). This enforces the write/verify separation
      # required by the trust anchor model.
      - verifier-state:/data/verifier-state
    depends_on:
      immudb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.1
    container_name: spire-server
    user: "0:0"
    # No host port published (R1, Phase 1.3 completion pass): SPIRE's own
    # management API. spire-agent reaches it by compose DNS name
    # (server_address = "spire-server" in agent.conf), which does not
    # require a host-published port.
    volumes:
      - ./spire/server/server.conf:/opt/spire/conf/server/server.conf
      - spire-server-data:/opt/spire/data
      - spire-server-socket:/tmp/spire-server
      - ./scripts/init-spire-data.sh:/docker-entrypoint-initdb.d/init-spire-data.sh
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/tmp/spire-server/private/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    command: ["/opt/spire/bin/spire-server", "run", "-config", "/opt/spire/conf/server/server.conf"]
    networks:
      - backend

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.1
    user: "0:0"
    depends_on:
      spire-server:
        condition: service_healthy
      token-generator:
        condition: service_completed_successfully
    volumes:
      - spire-agent-config:/opt/spire/conf/agent
      - spire-sockets:/tmp/spire-sockets
      - spire-agent-data:/opt/spire/data
      # Read-only: trust bundle written by token-generator for secure bootstrap.
      - spire-bundle:/opt/spire/bundle:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/tmp/spire-sockets/workload_api.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    # restart: "no" — the spire-agent-watchdog service manages restarts.
    # It generates a fresh join token before each restart so the one-time
    # token is never re-used, which is what caused the crash-loop.
    restart: "no"
    command: ["/opt/spire/bin/spire-agent", "run", "-config", "/opt/spire/conf/agent/agent.conf"]
    networks:
      - backend

  spire-agent-watchdog:
    image: docker:cli
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - spire-server-socket:/tmp/spire-server
      - spire-agent-config:/opt/spire/agent-config
      - spire-bundle:/opt/spire/bundle
      - ./scripts/spire-watchdog.sh:/opt/spire/watchdog.sh:ro
    entrypoint: ["/bin/sh", "/opt/spire/watchdog.sh"]
    restart: unless-stopped
    networks:
      - backend

  envoy:
    image: envoyproxy/envoy:v1.27.7
    pid: "service:spire-agent"
    ports:
      - "8443:8443"
      # 9901 (Envoy's own admin API) is not published to the host (R1,
      # Phase 1.3 completion pass): it is a management surface, not the
      # client-facing mTLS gate.
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - spire-sockets:/tmp/spire-sockets
    depends_on:
      spire-agent:
        condition: service_started
      decision-service:
        condition: service_healthy
    restart: always
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]
    # P2-1 (Phase 2): the only dual-homed service. edge, to accept the
    # agent's mTLS connection; backend, to reach decision-service (its
    # retargeted upstream cluster - see envoy/envoy.yaml). This mirrors the
    # segmented-HTTP topology docs/reports/spike-mcp-mediation.md confirmed
    # safe: a client on edge alone cannot resolve or route to anything on
    # backend directly, only through this proxy.
    networks:
      - edge
      - backend

  python-mtls-test:
    image: python:3.11-slim
    pid: "service:spire-agent"
    environment:
      - SPIFFE_ENDPOINT_SOCKET=unix:///tmp/spire-sockets/workload_api.sock
    volumes:
      - ./test_mtls_flow.py:/app/test_mtls_flow.py
      - spire-sockets:/tmp/spire-sockets
    working_dir: /app
    command: ["sh", "-c", "pip install httpx spiffe==0.2.5 && python test_mtls_flow.py"]
    depends_on:
      envoy:
        condition: service_started
      spire-agent:
        condition: service_started
      workload-registrar:
        condition: service_completed_successfully
    # Diagnostic smoke test for the Envoy mTLS handshake only - talks to
    # envoy, nothing on backend. edge is sufficient and keeps this test
    # container out of the segment P2-1 is protecting.
    networks:
      - edge

  workload-registrar:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - spire-server-socket:/tmp/spire-server
      - ./scripts/register-workloads-container.sh:/opt/register.sh
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/register.sh"]
    networks:
      - backend

  # AIL Decision Service (Phase 2, D12) — owns schema validation, the OPA
  # query, the ledger write, and the D14 mediated tool's execution. The
  # agent sends one request to POST /decide and gets back a verdict; this
  # is the only thing on the network that can reach opa, verifier,
  # ail-control-plane, or immudb.
  decision-service:
    build:
      context: .
      dockerfile: decision_service/Dockerfile
    environment:
      - OPA_URL=http://opa:8181/v1/data/ail/main/evaluation
      - AIL_BUNDLE_NAME=${AIL_BUNDLE_NAME:-ail-policies}
      - VERIFIER_URL=http://verifier:8003
      - CONTROL_PLANE_URL=http://ail-control-plane:8002
      # Content-store writes (D5, D7) - moved here from the agent's own env
      # (D12). Write-scoped key, never the read key (D6).
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY}
      # D21 (Phase 3a completion): ledger/immudb_ledger.py's decision and
      # intent writes now carry this. Write-scoped only - this service never
      # calls verifier /verify, so it is never provisioned with
      # VERIFIER_READ_KEY (control_plane/main.py holds that one).
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY}
      # D22 (Phase 3b): the decision service's own long-lived writer key,
      # mounted read-only. Deliberately NOT its SPIFFE SVID - Question A of
      # docs/reports/spike-signing-anchor.md returned NO-GO because an
      # SVID-signed record stops verifying once the leaf's 24-hour TTL
      # expires, and this signature has to outlive the process by years.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-decision.key
      - VAULT_TOKEN_PATH=/run/secrets/vault_api_token
    volumes:
      - ./keys:/keys:ro
    secrets:
      # D14: attached only here, never to langgraph-demo - this container
      # attachment is the primary boundary. mode: 0400 is declared for
      # Swarm-mode compatibility but plain `docker compose` ignores it
      # (Compose says so directly at startup); decision_service/main.py's
      # own startup check (_verify_mcp_stdio_secret_mount) does not rely on
      # it either - it confirms the mount is read-only to the container
      # itself before recording exclusivity: demonstrated for
      # read_vault_secret. This is the credential-delivery boundary
      # tests/test_credential_boundary_static.py asserts statically and
      # tests/test_vault_tool_bypass.py exercises live from inside the
      # agent container.
      - source: vault_api_token
        target: vault_api_token
        mode: 0400
    depends_on:
      opa:
        condition: service_healthy
      verifier:
        condition: service_healthy
      ail-control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # backend-only: reached exclusively through envoy's retargeted mTLS
    # listener (envoy/envoy.yaml). No edge membership, ever.
    networks:
      - backend

  langgraph-demo:
    build:
      context: .
    pid: "service:spire-agent"
    stdin_open: true
    tty: true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPIFFE_ENDPOINT_SOCKET=unix:///tmp/spire-sockets/workload_api.sock
      # D12 (Phase 2): the agent's only outbound target for anything AIL-
      # related. It holds no VERIFIER_URL, no IMMUDB_USER/PASSWORD, no
      # CONTROL_PLANE_URL/WRITE_KEY, and no direct OPA_URL any more - see
      # docs/adr/0008-decision-service-boundary.md and
      # tests/test_decision_service_network_isolation.py. D21 (Phase 3a
      # completion): also holds neither VERIFIER_READ_KEY nor
      # VERIFIER_WRITE_KEY - it has no route to the verifier at all (backend-
      # only, below), so provisioning it with either credential would be a
      # key with nowhere to be used, not a capability.
      - DECISION_SERVICE_URL=https://envoy:8443/decide
      - SPIRE_DISABLED=false
      - AIL_TENANT_ID=${AIL_TENANT_ID:-tenant_default}
      - AIL_BUNDLE_NAME=${AIL_BUNDLE_NAME:-ail-policies}
    volumes:
      # SPIRE workload socket — runtime mount, not baked into image.
      - spire-sockets:/tmp/spire-sockets
    working_dir: /app
    command:
      - bash
      - -c
      - |
        echo 'Waiting for SPIRE workload socket...'
        until [ -S /tmp/spire-sockets/workload_api.sock ]; do sleep 2; done
        echo 'SPIRE ready. Starting demo...'
        exec su -s /bin/bash ail-agent -c 'python /app/framework_integration/langgraph_demo.py'
    depends_on:
      spire-agent:
        condition: service_started
      envoy:
        condition: service_started
      decision-service:
        condition: service_healthy
      policy-validator:
        condition: service_completed_successfully
    # P2-1 (Phase 2), the exit criterion's own mechanism: edge-only. No
    # route to opa, verifier, ail-control-plane, or immudb exists from this
    # container at all - not authenticated-away, structurally absent. See
    # tests/test_decision_service_network_isolation.py, which asserts this
    # by inspecting the running container's actual network attachments, and
    # tests/test_vault_tool_bypass.py, which confirms it live.
    networks:
      - edge

  # Epic 4: Observability & Telemetry
  prometheus:
    image: prom/prometheus:v3.10.0
    user: "0:0"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.2
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - backend

  token-generator:
    image: docker:cli
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - spire-tokens:/opt/spire/tokens
      - spire-server-socket:/tmp/spire-server
      - spire-agent-config:/opt/spire/agent-config
      - spire-bundle:/opt/spire/bundle
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - "-c"
      - |
        echo "=== SPIRE Token Generator ==="
        SOCKET="/tmp/spire-server/private/api.sock"

        echo "Waiting for SPIRE server admin socket..."
        until [ -S "$$SOCKET" ]; do
          echo "  Socket not ready, waiting..."
          sleep 2
        done

        echo "Server socket ready. Generating join token..."
        TOKEN_OUTPUT=$$(docker exec spire-server \
          /opt/spire/bin/spire-server token generate \
          -spiffeID spiffe://ail.internal/agent/local \
          -socketPath "$$SOCKET" 2>&1)

        echo "Token generation result: $$TOKEN_OUTPUT"

        TOKEN=$$(echo "$$TOKEN_OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')

        if [ -z "$$TOKEN" ]; then
          echo "ERROR: Failed to extract token from output"
          exit 1
        fi

        echo "Generated token: $${TOKEN:0:8}..."
        echo "$$TOKEN" > /opt/spire/tokens/join_token
        echo "Token written to shared volume"

        echo "Exporting SPIRE trust bundle for secure bootstrap..."
        docker exec spire-server \
          /opt/spire/bin/spire-server bundle show \
          -format pem \
          -socketPath "$$SOCKET" \
          > /opt/spire/bundle/trust_bundle.pem
        echo "Trust bundle written to shared volume."

        echo "Writing agent.conf with live token (insecure_bootstrap=false)..."
        {
          echo 'agent {'
          echo '    data_dir          = "/opt/spire/data"'
          echo '    log_level         = "INFO"'
          echo '    server_address    = "spire-server"'
          echo '    server_port       = "8081"'
          echo '    socket_path       = "/tmp/spire-sockets/workload_api.sock"'
          echo '    trust_domain      = "ail.internal"'
          echo '    insecure_bootstrap = false'
          echo '    trust_bundle_path  = "/opt/spire/bundle/trust_bundle.pem"'
          echo "    join_token        = \"$$TOKEN\""
          echo '}'
          echo ''
          echo 'plugins {'
          echo '    NodeAttestor "join_token" {'
          echo '        plugin_data {}'
          echo '    }'
          echo '    KeyManager "disk" {'
          echo '        plugin_data {'
          echo '            directory = "/opt/spire/data"'
          echo '        }'
          echo '    }'
          echo '    WorkloadAttestor "unix" {'
          echo '        plugin_data {}'
          echo '    }'
          echo '}'
        } > /opt/spire/agent-config/agent.conf
        echo "agent.conf written"
        echo "=== Token generation complete ==="
    networks:
      - backend

  # Validates all Rego policies (core + all packs) compile cleanly before
  # the agent starts. Checks the full source tree regardless of which packs
  # are enabled — catches syntax/type errors in inactive packs too.
  # Exits non-zero on any error; langgraph-demo will not start if this fails.
  policy-validator:
    image: openpolicyagent/opa:1.14.1
    volumes:
      - ./policy/core:/policy/core:ro
      - ./policy/packs:/policy/packs:ro
    command: ["check", "--strict", "/policy/core", "/policy/packs"]
    restart: "no"

  # Phase 3: CISO Control Plane Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Only a UI default (which tenant is preselected), not a secret -
        # safe to bake into the JS bundle. The control plane's API key is
        # never a build arg or a NEXT_PUBLIC_* var - see D4 and
        # dashboard/app/api/*/route.ts, which hold it server-side only.
        NEXT_PUBLIC_TENANT_ID: tenant_default
    ports:
      - "3001:3001"
    environment:
      # Server-side only (Route Handlers under app/api/) - never reaches
      # the browser bundle. Two independent control-plane keys (D6): the
      # audit route forwards READ, the tenants PUT route forwards WRITE.
      - CONTROL_PLANE_URL=http://ail-control-plane:8002
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY}
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY}
      # Caller-facing credentials for the dashboard's own routes (D6) -
      # checked in dashboard/middleware.ts before any control-plane key is
      # ever attached. Two independent pairs, not a hierarchy - the read
      # pair never authorizes a write route.
      - DASHBOARD_READ_USER=${DASHBOARD_READ_USER}
      - DASHBOARD_READ_PASSWORD=${DASHBOARD_READ_PASSWORD}
      - DASHBOARD_WRITE_USER=${DASHBOARD_WRITE_USER}
      - DASHBOARD_WRITE_PASSWORD=${DASHBOARD_WRITE_PASSWORD}
    depends_on:
      ail-control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  # D23 (Phase 3b): the periodic external anchoring job.
  #
  # This is the one service in this file that is expected to reach the
  # public internet, and the one whose failure denies nothing. It asks the
  # verifier for ImmuDB's current signed state, submits that state's
  # canonical payload to a Rekor v2 instance discovered from Sigstore's own
  # TUF-distributed configuration, and records the accepted entry in the
  # control plane's anchor store. If any of that fails, it logs and waits -
  # writes continue, decisions continue, and the next bundle exported for an
  # un-covered record says not_anchored in an explicit field rather than
  # omitting one. See docs/adr/0012-writer-signing-and-external-anchoring.md.
  #
  # backend-only, like every other non-agent service: it calls out, and
  # nothing calls it. It publishes no port because it is a loop, not a
  # server, which is also why it has no healthcheck - there is nothing to
  # probe, and a probe that always passed would say less than nothing.
  #
  # Deliberately absent from docker-compose.test.yml: the integration suite
  # must not depend on a shared public service or on CI having egress, and
  # P3b-4 records the live submission as a command-backed claim rather than
  # a test. Its absence there is itself the P3b-5 demonstration - the whole
  # suite runs with anchoring entirely broken.
  anchor-service:
    build:
      context: .
      dockerfile: anchor_service/Dockerfile
    environment:
      - VERIFIER_URL=http://verifier:8003
      - CONTROL_PLANE_URL=http://ail-control-plane:8002
      # Read-scoped on the verifier (it only reads /state), write-scoped on
      # the control plane (it only writes /anchors). Neither is a new
      # credential and neither widens what this key already authorizes.
      - VERIFIER_READ_KEY=${VERIFIER_READ_KEY}
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY}
      # Self-managed, never Fulcio: a keyless flow would put an OIDC
      # identity on the public record where a bare P-256 point suffices.
      - AIL_ANCHOR_SIGNING_KEY=/keys/anchor-signing.key
      - AIL_ANCHOR_INTERVAL_SECONDS=${AIL_ANCHOR_INTERVAL_SECONDS:-300}
      # D36 (Phase 3c-3c): the reserve, declared rather than defaulted
      # independently in four modules. It is bound into the ledger at first
      # allocation and every reader refuses on disagreement, so these three
      # declarations have to be the same string.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
      - AIL_RECONCILE_INTERVAL_SECONDS=${AIL_RECONCILE_INTERVAL_SECONDS:-900}
    volumes:
      - ./keys:/keys:ro
    depends_on:
      verifier:
        condition: service_healthy
      ail-control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

networks:
  # P2-1 (Phase 2): the agent's only network. It can resolve and route to
  # envoy (dual-homed below) and nothing else in this file - opa, verifier,
  # ail-control-plane, and immudb all live on backend only.
  edge:
  # Everything the agent must never reach directly. envoy is the sole
  # bridge (dual-homed). This is what makes U1's manifest forgery, U5's
  # forged tombstone, and U8's unauthenticated policy replacement
  # (docs/reports/phase-1-2-redteam.md) unrepresentable from the agent's
  # network position, not just untested from it.
  backend:

secrets:
  # D14 demonstration credential. Generated by "make keygen" (gitignored,
  # never committed - see .gitignore). Attached only to decision-service,
  # below.
  vault_api_token:
    file: ./decision_service/secrets/vault_api_token.txt

volumes:
  spire-server-data:
  spire-server-socket:
  spire-sockets:
  spire-agent-data:
  spire-agent-config:
  spire-tokens:
  # Shared SPIRE server CA bundle for secure (non-insecure) agent bootstrap.
  spire-bundle:
  grafana-data:
  # Persists SQLite tenant config across docker compose down/up cycles.
  control-plane-data:
  # Verifier's rolling SDK state (PersistentRootService pickle).
  # Not mounted in the interceptor container — enforces write/verify separation.
  verifier-state:
  # ImmuDB's own data directory. Must persist symmetrically with
  # verifier-state (Phase 1, P1-10) or a down/up cycle without -v produces a
  # verifier trust anchor pointing at transactions ImmuDB no longer has.
  immudb-data:
