# OPA Bundle API Configuration
# OPA polls the AIL Control Plane for its active policy bundle.
# The control plane dynamically builds the bundle based on the tenant's
# enabled compliance frameworks and custom policy variables.
#
# The bundle key below (AIL_BUNDLE_NAME) is single-sourced with
# interceptor/middleware.py's _BUNDLE_NAME via the same env-var-substitution
# mechanism already used for AIL_TENANT_ID - both must be set identically on
# the opa container and on every agent container that queries it. A drifted
# copy of this name used to be indistinguishable from a policy denial at
# every subsequent tool call (docs/reports/phase-0-redteam.md, C4); see
# docs/reports/phase-0-1.md, P01-3.

# R4 (Phase 1.3 completion pass, red-team V6): GET /bundles/{tenant_id}
# returned the same tenant configuration GET /tenants/{id} is gated to
# protect, with no credential at all. OPA is the only caller of this route,
# so it carries the read-scoped credential here - the write key is never
# needed for a read-only poll.
services:
  - name: ail-control-plane
    url: http://ail-control-plane:8002
    headers:
      X-API-Key: ${CONTROL_PLANE_READ_KEY}

bundles:
  ${AIL_BUNDLE_NAME}:
    service: ail-control-plane
    resource: /bundles/${AIL_TENANT_ID}
    polling:
      min_delay_seconds: 10
      max_delay_seconds: 20
