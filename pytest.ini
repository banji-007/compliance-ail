[pytest]
# test_mtls_flow.py lives at the repo root because docker-compose.yml
# bind-mounts it directly into the python-mtls-test service (it is not a
# pytest test, it is a live smoke-test script run inside the stack). Without
# this, a bare "pytest" invocation picks it up anyway since it matches the
# default test_*.py / test_* naming convention, and collects one more item
# than "pytest tests/" does for no reason related to the actual test suite.
testpaths = tests
