# docker-compose.test.yml — Minimal CI infrastructure for integration tests.
#
# Spins up the services pytest needs:
#   ail-control-plane  — serves OPA policy bundles; seeds default tenant
#   opa                — policy engine; polls bundle from control plane
#   immudb             — tamper-evident audit ledger
#   verifier           — isolated immudb-py (gRPC) wrapper
#   decision-service   — Phase 2, D12: schema/OPA/ledger, moved out of the
#                         agent process. Published to the host (unlike
#                         docker-compose.yml's backend-only placement) for
#                         the same "tests run on the host" reason every
#                         other service here is.
#   dashboard          — Next.js dashboard, for D6's caller-auth tests only
#                         (tests/test_dashboard_auth.py); no other test
#                         exercises it.
#
#   anchor-service     P3c3c-4, and in AIL_ANCHOR_MODE=reconcile-only only.
#                         The sequence reconciliation lives in this service
#                         and had no test coverage at all while the service
#                         was absent.
#
# The ANCHORING half of anchor-service is still NOT included, and its absence
# is load-bearing rather than an omission. Anchoring is the project's one
# deliberately fail-open subsystem, so the whole integration suite runs with
# it entirely broken: every bundle this stack exports says not_anchored, and
# every write still succeeds. That is the P3b-5 demonstration, run on every
# CI job rather than staged once. It is also why no test here submits to a
# public transparency log: the live submission is a command-backed claim
# (docs/reports/phase-3b.md), never a CI test that would make this suite
# depend on a shared public service and on CI having egress. reconcile-only
# mode never calls anchor_once, never reads /state and holds no anchoring
# key, so running the reconciler here takes nothing back from that.
#
# SPIRE, Envoy, Grafana, and Prometheus are NOT included. Tests run with
# SPIRE_DISABLED=true so mTLS is bypassed - this file has no edge/backend
# network split either, for the same reason: it is a flat, deliberately
# permissive topology for pytest running on the host, not a mirror of
# docker-compose.yml's production segmentation. P2-1's network-isolation
# test (tests/test_decision_service_network_isolation.py) asserts the
# segmentation statically against docker-compose.yml's own YAML, and this
# file is deliberately excluded from that assertion - same pattern
# tests/test_host_port_bindings.py already established for port bindings.
#
# Deliberately more permissive than docker-compose.yml (R1, Phase 1.3
# completion pass): ail-control-plane (8002), immudb (3322 and 8080), opa
# (8181, loopback-bound), verifier (8003, loopback-bound), and
# decision-service (8010, loopback-bound) are all published to the host
# here, because the test suite runs on the host and needs to reach every
# service directly - the interceptor under test, the raw ImmuDB scans in
# tests/test_verification.py and tests/test_record_profile.py, and the
# direct OPA/decision-service queries in tests/test_bundle_revision_
# attribution.py all connect over localhost. This file is not a deployment
# target and is never published beyond CI/local test runs.
#
# Usage:  make test-integration
# Requires: Docker Compose v2 (docker compose, not docker-compose)

services:

  ail-control-plane:
    build:
      # D22 (Phase 3b): built from the repo root so the image can carry
      # provenance/ - the canonicalization rule this service shares with
      # every other writer of a ledger record.
      context: .
      dockerfile: control_plane/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:////data/control_plane.db
      - IMMUDB_URL=http://immudb:8080
      - IMMUDB_USER=${IMMUDB_USER:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
      - VERIFIER_URL=http://verifier:8003
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY:-test-read-key}
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY:-test-write-key}
      # D21 (Phase 3a completion): the verifier's own credential pair -
      # see docker-compose.yml's ail-control-plane service for the reasoning.
      - VERIFIER_READ_KEY=${VERIFIER_READ_KEY:-test-verifier-read-key}
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY:-test-verifier-write-key}
      # D22 (Phase 3b): this service's own writer key - see
      # docker-compose.yml's ail-control-plane service for why there is one
      # per writer.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-control-plane.key
      # D36 (Phase 3c-3c): declared, not left to four independent defaults.
      # The reserve is bound into the ledger at first allocation and every
      # reader refuses on disagreement, so this value and the verifier's and
      # the anchor service's have to be the same string.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
    volumes:
      - ./policy:/policy:ro
      - ./keys:/keys:ro
      - test-control-plane-data:/data
    working_dir: /app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

  opa:
    image: openpolicyagent/opa:1.14.1
    ports:
      # Loopback-only (P13-1) - see docker-compose.yml's opa service for why.
      # tests/ run on the host (localhost), which this still reaches.
      - "127.0.0.1:8181:8181"
    environment:
      - AIL_TENANT_ID=tenant_default
      - AIL_BUNDLE_NAME=${AIL_BUNDLE_NAME:-ail-policies}
      # R4 (Phase 1.3 completion pass): opa-config.yaml attaches this as the
      # X-API-Key header on every bundle poll - GET /bundles/{tenant} now
      # requires the read-scoped credential (red-team V6).
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY:-test-read-key}
    command:
      - "run"
      - "--server"
      - "--config-file=/config/opa-config.yaml"
      - "--log-format=text"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
    volumes:
      - ./opa-config.yaml:/config/opa-config.yaml:ro
    depends_on:
      ail-control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

  immudb:
    image: codenotary/immudb:1.9.5
    ports:
      # Expose both ports to host: REST (8080) for scan calls from tests running
      # on the host, and gRPC (3322) for the in-process immudb-py tamper tests.
      - "8080:8080"
      - "3322:3322"
    environment:
      - IMMUDB_USER=${IMMUDB_USER:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
    volumes:
      - ./keys:/keys:ro
      # ImmuDB's own data dir - must persist symmetrically with
      # test-verifier-state (P1-10) or a down (no -v) + up cycle leaves the
      # verifier's trust anchor pointing at transactions a fresh, empty
      # ImmuDB no longer has, and the next verifiedGet fails with "illegal
      # state".
      - test-immudb-data:/var/lib/immudb
    command:
      - "--signingKey=/keys/signing.key"
    healthcheck:
      test: ["CMD", "immuadmin", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  verifier:
    build:
      # D35 (Phase 3c-3c): built from the repo root so the image can
      # carry provenance/ - this service signs the fault record it writes.
      context: .
      dockerfile: verifier/Dockerfile
    ports:
      # Loopback-only (P13-2) - see docker-compose.yml's verifier service for
      # why. tests/ run on the host (localhost), which this still reaches.
      - "127.0.0.1:8003:8003"
    environment:
      - IMMUDB_ADDR=immudb:3322
      - IMMUDB_USER=${IMMUDB_USER:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
      - IMMUDB_SIGNING_PUBKEY=/keys/signing.pub
      - VERIFIER_STATE_FILE=/data/verifier-state/immudb.state
      # D21 (Phase 3a completion): see docker-compose.yml's verifier service
      # for the reasoning.
      - VERIFIER_READ_KEY=${VERIFIER_READ_KEY:-test-verifier-read-key}
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY:-test-verifier-write-key}
      # D22/D35: this service's own writer key, for the fault record it
      # writes about its own failed proofs.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-verifier.key
      # D36: see ail-control-plane above.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
    volumes:
      - ./keys:/keys:ro
      - test-verifier-state:/data/verifier-state
    depends_on:
      immudb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s

  decision-service:
    build:
      context: .
      dockerfile: decision_service/Dockerfile
    ports:
      # Loopback-only, same convention as opa/verifier above.
      - "127.0.0.1:8010:8010"
      # Prometheus metrics (moved here from the agent process, D12) -
      # tests/test_content_states.py::_metric_total reads this from the host.
      - "127.0.0.1:8000:8000"
    environment:
      - OPA_URL=http://opa:8181/v1/data/ail/main/evaluation
      - AIL_BUNDLE_NAME=${AIL_BUNDLE_NAME:-ail-policies}
      - VERIFIER_URL=http://verifier:8003
      - CONTROL_PLANE_URL=http://ail-control-plane:8002
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY:-test-write-key}
      # D21 (Phase 3a completion): write-scoped only - see docker-compose.yml's
      # decision-service for why it never holds VERIFIER_READ_KEY.
      - VERIFIER_WRITE_KEY=${VERIFIER_WRITE_KEY:-test-verifier-write-key}
      # D22 (Phase 3b): the decision service's own writer key.
      - AIL_WRITER_SIGNING_KEY=/keys/writer-decision.key
      - VAULT_TOKEN_PATH=/run/secrets/vault_api_token
    volumes:
      - ./keys:/keys:ro
    secrets:
      - source: vault_api_token
        target: vault_api_token
        mode: 0400
    depends_on:
      opa:
        condition: service_healthy
      verifier:
        condition: service_healthy
      ail-control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  # P3c3c-4 (Phase 3c-3c): the reconciler, running as a service, with
  # anchoring entirely absent.
  #
  # Reconciliation lives in anchor_service because that service is already
  # the right shape - a periodic loop that observes and never gates a write.
  # Until this phase it was therefore exercised by no test at all, because
  # anchor-service is absent from this file and its absence is load-bearing
  # (see the header): the suite running with anchoring entirely broken is
  # P3b-5's demonstration, and adding the anchoring loop here would destroy
  # that property and make CI depend on egress to a public Rekor instance.
  #
  # AIL_ANCHOR_MODE=reconcile-only is what separates the two. The image is
  # the same image; the loop runs reconciliation on its own interval and
  # never calls anchor_once, never reads the verifier's /state, never
  # submits anything, and needs no anchoring key. So the reconciler is
  # genuinely running here and anchoring is still entirely absent from this
  # stack - tests/test_reconciliation.py asserts both halves, the second by
  # exporting a bundle and requiring it to say not_anchored.
  anchor-service:
    build:
      context: .
      dockerfile: anchor_service/Dockerfile
    environment:
      - AIL_ANCHOR_MODE=reconcile-only
      - IMMUDB_URL=http://immudb:8080
      - IMMUDB_USER=${IMMUDB_USER:-immudb}
      - IMMUDB_PASSWORD=${IMMUDB_PASSWORD:-immudb}
      # D36: see ail-control-plane above.
      - AIL_RESERVED_POSITIONS=${AIL_RESERVED_POSITIONS:-1000000000}
      # Short enough that a test can create a condition and see the next
      # pass find it, rather than mocking a pass and asserting on the mock.
      - AIL_RECONCILE_INTERVAL_SECONDS=${AIL_RECONCILE_INTERVAL_SECONDS:-5}
      # Every pass writes its verdict here. A file rather than a log line
      # because a test has to read the running service's own output, and a
      # file it can parse says the same thing without teaching the suite to
      # scrape a log format. Removing the service leaves this file stale,
      # which is what makes P3c3c-4's mutation fail loudly rather than skip.
      - AIL_RECONCILE_REPORT_PATH=/reconcile/last.json
    volumes:
      - ./tests/.reconcile:/reconcile
    depends_on:
      immudb:
        condition: service_healthy
    restart: unless-stopped

  # D6 (Phase 1.1) only - dashboard/middleware.ts's own caller auth, tested
  # by tests/test_dashboard_auth.py. No other test in this suite depends on
  # this service being up.
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3001:3001"
    environment:
      - CONTROL_PLANE_URL=http://ail-control-plane:8002
      - CONTROL_PLANE_READ_KEY=${CONTROL_PLANE_READ_KEY:-test-read-key}
      - CONTROL_PLANE_WRITE_KEY=${CONTROL_PLANE_WRITE_KEY:-test-write-key}
      - DASHBOARD_READ_USER=${DASHBOARD_READ_USER:-test-dashboard-reader}
      - DASHBOARD_READ_PASSWORD=${DASHBOARD_READ_PASSWORD:-test-dashboard-read-pw}
      - DASHBOARD_WRITE_USER=${DASHBOARD_WRITE_USER:-test-dashboard-writer}
      - DASHBOARD_WRITE_PASSWORD=${DASHBOARD_WRITE_PASSWORD:-test-dashboard-write-pw}
    depends_on:
      ail-control-plane:
        condition: service_healthy
    # No custom /health route exists in this Next.js app; /audit always
    # renders 200 without auth (only /api/* is gated by middleware.ts), so
    # it doubles as a liveness probe here.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/audit',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s

secrets:
  vault_api_token:
    file: ./decision_service/secrets/vault_api_token.txt

volumes:
  test-control-plane-data:
  test-verifier-state:
  test-immudb-data:
