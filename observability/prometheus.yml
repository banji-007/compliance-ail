# Prometheus Configuration for AIL Observability
# Epic 4: Real-time CISO Dashboard

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # Add AIL-specific alerting rules here in future

scrape_configs:
  # OPA Metrics Scrape Job
  - job_name: 'opa'
    static_configs:
      - targets: ['opa:8181']
    scrape_interval: 5s
    metrics_path: /metrics
    # OPA natively exposes Prometheus metrics for policy decisions,
    # bundle loading, and performance telemetry
    
  # AIL decision-service metrics (Phase 2, D12: moved here from the agent
  # process - langgraph-demo no longer runs a metrics server at all, since
  # it no longer makes the decision this metric counts).
  - job_name: 'ail-decision-service'
    static_configs:
      - targets: ['decision-service:8000']
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
